name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Homebrew dependencies
        run: |
          brew install cairo libffi gobject-introspection

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller eBL_Photo_Stitcher_MacOS.spec --clean

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r "eBL_Photo_Stitcher_macOS.zip" "eBL Photo Stitcher.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eBL-Photo-Stitcher-macOS
          path: dist/eBL_Photo_Stitcher_macOS.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eBL_Photo_Stitcher_macOS.zip
